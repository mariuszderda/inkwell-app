apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: inkwell
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: inkwell-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          envFrom:
            - configMapRef: { name: web-config }
            - secretRef: { name: web-secret }
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10      # daj gunicornowi czas na start
            periodSeconds: 10
