apiVersion: v1
kind: Secret
metadata:
  name: web-secret
  namespace: inkwell
type: Opaque
stringData:
  POSTGRES_DB: inkwell
  POSTGRES_USER: postgres
  DATABASE_URL: "postgres://postgres:{{ postgres_password }}@postgres:5432/inkwell"
  REDIS_URL: "redis://redis:6379/0"
  SECRET_KEY: "{{ django_secret_key }}"