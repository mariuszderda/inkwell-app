apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: inkwell
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ app_image }}"
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef: { name: web-config }
            - secretRef: { name: web-secret }
