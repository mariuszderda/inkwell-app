apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: inkwell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: "{{ app_image }}"
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "my_medium", "worker", "--loglevel=INFO", "--concurrency=2"]
          envFrom:
            - configMapRef:  {name: web-config}
            - secretRef: {name: web-secret}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}

