apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: inkwell
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "{{ app_domain }}"
      secretName: web-tls
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80