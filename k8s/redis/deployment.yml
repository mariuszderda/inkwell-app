apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: inkwell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 5432
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
