name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/mariuszderda/inkwell-web

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/app/my_medium
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inkwell
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
            --health-cmd "pg_isready -U postgres"
            --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/inkwell
      SECRET_KEY: tylko-do-testow-w-ci
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py test

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      id-token: write
    env:
      GCP_AUTH_KIND: application
      ANSIBLE_SSH_RETRIES: "5"
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/141383313394/locations/global/workloadIdentityPools/github/providers/github
          service_account: ansible@devops-automation-514010.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ansible i kolekcje
        run: |
          pip install ansible-core google-auth requests
          ansible-galaxy collection install -r requirements.yml -p ./collections

      - name: Czy klaster istnieje
        run: |
          ansible role_k3s_master --list-hosts | grep -q k3s-master \
            || { echo "::error::Brak klastra, nie ma gdzie wdrażać"; exit 1; }

      - name: Klucz SSH na czas wdrożenia
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N "" -q -f ~/.ssh/ci
          gcloud compute os-login ssh-keys add --key-file ~/.ssh/ci.pub --ttl 30m > /dev/null
          echo "ANSIBLE_REMOTE_USER=$(gcloud compute os-login describe-profile --format='value(posixAccounts[0].username)')" >> "$GITHUB_ENV"
          echo "ANSIBLE_PRIVATE_KEY_FILE=$HOME/.ssh/ci" >> "$GITHUB_ENV"

      - name: Tymczasowa reguła firewalla dla runnera
        run: |
          gcloud compute firewall-rules create ci-ssh-${{ github.run_id }} \
            --network inkwell-vpc --allow tcp:22 \
            --source-ranges "$(curl -s https://ifconfig.me)/32" --quiet

      - name: Hasło Vaulta
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          mkdir -p ~/.ansible
          printf '%s' "$VAULT_PASS" > ~/.ansible/vault_pass
          chmod 600 ~/.ansible/vault_pass

      - name: Wdrożenie
        run: ansible-playbook playbooks/app.yml -e app_image_tag=${{ github.sha }}

      - name: Testy dymne
        run: ansible-playbook playbooks/smoke.yml

      - name: Usuń regułę firewalla
        if: always()
        run: gcloud compute firewall-rules delete ci-ssh-${{ github.run_id }} --quiet
