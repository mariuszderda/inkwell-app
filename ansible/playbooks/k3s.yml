- name: k3s-master
  hosts: role_k3s_master
  become: true
  gather_facts: false
  roles:
    - k3s_server

- name: k3s-workery
  hosts: role_k3s_worker
  become: true
  gather_facts: false
  roles:
    - k3s_agent

- name: kubeconfig na laptopa
  hosts: role_k3s_master
  become: true
  gather_facts: true
  tasks:
    - name: Odczytaj kubeconfig z mastera 
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: kubeconfig

    - name: Zapisz lokalnie z publicznym adresem
      ansible.builtin.copy:
        content: >-
          {{ kubeconfig.content | b64decode
             | replace('127.0.0.1', ansible_host)
             | replace(': default', ': inkwell-gcp') }}
        dest: "{{ lookup('env', 'HOME') }}/.kube/inkwell-gcp.yaml"
        mode: "0600"
      delegate_to: localhost
      become: false
