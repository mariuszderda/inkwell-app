plugin: google.cloud.gcp_compute
projects: [devops-automation-514010]
zones: [europe-central2-a]
filters:
  - labels.project = inkwell
keyed_groups:
  - key: labels.role                 # tworzy grupy: role_k3s_master, role_k3s_worker
    prefix: role
hostnames: [name]
compose:
  ansible_host: networkInterfaces[0].accessConfigs[0].natIP
  ansible_python_interpreter: "'/usr/bin/python3'"
