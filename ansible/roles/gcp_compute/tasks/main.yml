- name: Pobierz statyczny IP (tylko odczyt)
  google.cloud.gcp_compute_address_info:
    region: "{{ gcp_region }}"
    filters: ["name = {{ gcp_static_ip_name }}"]
  register: static_ip_info

- name: Virtual Machines
  google.cloud.gcp_compute_instance:
    name: "{{ item.name }}"
    zone: "{{ gcp_zone }}"
    machine_type: "{{ gcp_machine_type }}"
    labels:
      project: inkwell
      role: "{{ item.role }}"
    metadata:
      ssh-keys: "{{ ssh_user }}:{{ lookup('file', ssh_pubkey_file | expanduser) }}"
    disks:
      - boot: true
        auto_delete: true
        initialize_params:
          source_image: "{{ gcp_image }}"
          disk_size_gb: "{{ gcp_disk_size_gb }}"
    network_interfaces:
      - subnetwork:
          selfLink: "{{ gcp_subnet_selflink }}"
        access_configs: "{{ nat_static if item.static_ip else nat_ephemeral }}"
    state: "{{ gcp_compute_state }}"
    service_accounts:
      - email: "{{ gcp_nodes_sa }}"
        scopes: ["https://www.googleapis.com/auth/devstorage.read_write"]
  vars:
    nat_static:
      - name: External NAT
        type: ONE_TO_ONE_NAT
        nat_ip:
          address: "{{ static_ip_info.resources[0].address }}"
    nat_ephemeral:
      - name: External NAT
        type: ONE_TO_ONE_NAT
  loop: "{{ gcp_nodes }}"
  loop_control:
    label: "{{ item.name }}"
