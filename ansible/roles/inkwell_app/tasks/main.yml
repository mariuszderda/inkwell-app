- name: Katalogi na manifesty
  ansible.builtin.file:
    path: "{{ k8s_remote }}/{{ item }}"
    state: directory
    mode: "0700"
  loop: ["", postgres, redis, backup, web]

- name: Wyrenderuj manifesty na masterze
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ k8s_remote }}/{{ item | relpath(k8s_dir) }}"
    mode: "0600"
  loop: >-
    {{ query('fileglob',
             k8s_dir + '/*.yml',
             k8s_dir + '/postgres/*.yml',
             k8s_dir + '/redis/*.yml',
             k8s_dir + '/backup/*.yml',
             k8s_dir + '/web/*.yml') }}
  loop_control:
    label: "{{ item | relpath(k8s_dir) }}"

- name: Namespace i Postgres
  ansible.builtin.command: >-
    k3s kubectl apply -f {{ k8s_remote }}/namespace.yml -f {{ k8s_remote }}/postgres/
  register: r
  changed_when: "'created' in r.stdout or 'configured' in r.stdout"

- name: Czekaj na Postgresa
  ansible.builtin.command: k3s kubectl rollout status statefulset/postgres -n inkwell --timeout=180s
  changed_when: false

# tu Redis: apply + rollout status (piszesz sam)

- name: Redis
  ansible.builtin.command: >-
    k3s kubectl apply -f {{ k8s_remote }}/redis
  register: r
  changed_when: "'created' in r.stdout or 'configured' in r.stdout"

- name: Czekaj na redisa
  ansible.builtin.command: kubectl rollout status deployment/redis -n inkwell --timeout=120s
  changed_when: false

- name: Konfiguracja aplikacji
  ansible.builtin.command: >-
    k3s kubectl apply -f {{ k8s_remote }}/web/configmap.yml -f {{ k8s_remote }}/web/secret.yml
  register: r
  changed_when: "'created' in r.stdout or 'configured' in r.stdout"

- name: Usuń poprzedni Job migracji
  ansible.builtin.command: k3s kubectl delete job migrate -n inkwell --ignore-not-found

- name: Uruchom migracje
  ansible.builtin.command: k3s kubectl apply -f {{ k8s_remote }}/web/job-migrate.yml

- name: Czekaj na migracje
  ansible.builtin.command: k3s kubectl wait --for=condition=complete job/migrate -n inkwell --timeout=180s
  changed_when: false

- name: Aplikacja deployment + service + ingress
  ansible.builtin.command: >-
    k3s kubectl apply
      -f {{ k8s_remote }}/web/deployment.yml
      -f {{ k8s_remote }}/web/service.yml
      -f {{ k8s_remote }}/web/ingress.yml
      -f {{ k8s_remote }}/web/hpa.yml
      -f {{ k8s_remote }}/web/worker.yml
  register: r
  changed_when: "'created' in r.stdout or 'configured' in r.stdout"

- name: Czekaj na aplikacje
  ansible.builtin.command: kubectl rollout status deployment/web -n inkwell --timeout=180s
  changed_when: false

- name: Czekaj na workera
  ansible.builtin.command: k3s kubectl rollout status deployment/worker -n inkwell --timeout=180s
  changed_when: false
