- name: Pobierz skrypt instalacyjny k3s
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Katalog na manifesty k3s
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    mode: "0755"

- name: Traefik przypięty do mastera
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    mode: "0600"
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChartConfig
      metadata:
        name: traefik
        namespace: kube-system
      spec:
        valuesContent: |-
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
- name: cert-manager (instalowany przez k3s)
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/cert-manager.yaml
    mode: "0600"
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: cert-manager
        namespace: kube-system
      spec:
        repo: https://charts.jetstack.io
        chart: cert-manager
        version: {{ cert_manager_version }}
        targetNamespace: cert-manager
        createNamespace: true
        valuesContent: |-
          crds:
            enabled: true

- name: Zainstaluj k3s (server)
  ansible.builtin.command: /usr/local/bin/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_TOKEN: "{{ k3s_token }}"
    INSTALL_K3S_EXEC: >-
      server
      --tls-san {{ ansible_host }}
      --node-ip {{ networkInterfaces[0].networkIP }}
  args:
    creates: /usr/local/bin/k3s
  no_log: true

- name: Czekaj, aż master będzie ready
  ansible.builtin.command: >-
    k3s kubectl get node {{ inventory_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 30
  delay: 5
  changed_when: false
