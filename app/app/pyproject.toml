[project]
name = "inkwell"
version = "0.1.0"
description = "Inkwell - A 12-factor Medium-like blogging platform built with Django 5"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "django-environ>=0.11.2",
    "psycopg[binary]>=3.2.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "whitenoise>=6.7.0",
    "gunicorn>=23.0.0",
    "django-prometheus>=2.3.1",
    "python-json-logger>=2.0.7",
    "markdown>=3.7",
    "bleach>=6.1.0",
    "faker>=30.0.0",
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "my_medium.settings"
pythonpath = ["my_medium"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
