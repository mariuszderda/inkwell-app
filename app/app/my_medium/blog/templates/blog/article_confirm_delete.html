{% extends "blog/base.html" %}

{% block title %}Delete Article &mdash; Inkwell{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm p-4 bg-white">
      <h3 class="fw-bold mb-3">Delete Article</h3>
      <p class="text-muted">Are you sure you want to permanently delete <strong>"{{ article.title }}"</strong>?</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-danger rounded-pill px-4">Delete</button>
          <a href="{{ article.get_absolute_url }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
